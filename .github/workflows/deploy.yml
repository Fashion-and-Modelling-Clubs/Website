name: Deploy to GitHub Pages

# Runs every time you push to main, and can also be started by hand from the
# Actions tab (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish the newest run and cancel the older one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
